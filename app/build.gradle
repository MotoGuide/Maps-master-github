plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "org.zarroboogs.maps"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 2
        versionName "0.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 👇 关键修复：添加 CPU 架构支持（高德地图必须要）
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        //noinspection GroovyMissingReturnStatement
        releaseConfig {
            // 开源版：仅当密钥文件存在时配置 release 签名；文件缺失则跳过（他人 clone 后不影响 debug 构建）
            def releaseKeystore = file('../maps.keystore')
            if (releaseKeystore.exists() && System.console() != null) {
                storeFile releaseKeystore
                keyAlias System.console().readLine("\nkeyAlias:")
                keyPassword System.console().readLine("\nPassword:")
                storePassword System.console().readLine("\nPassword:")
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.releaseConfig
        }
        // 带混淆的分发版：继承 debug 签名，额外开启 R8 混淆+资源压缩（v3.2 安全升级）
        create("protected") {
            initWith debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                         'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
        implementation project(':nav-core')
        implementation project(':nav-hiking')
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"

        implementation files('libs/AMap3DMap_AMapNavi_AMapSearch_AMapLocation/AMap3DMap_11.1.200_AMapNavi_11.1.200_AMapSearch_9.7.4_AMapLocation_11.1.200_20260421.jar')

        // Room (replaces greenDAO)
        implementation 'androidx.room:room-runtime:2.3.0'
        implementation 'androidx.room:room-ktx:2.3.0'
        kapt 'androidx.room:room-compiler:2.3.0'

        // OkHttp3 (cloud sync)
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'

        implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
        implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
        implementation 'androidx.appcompat:appcompat:1.2.0'
        implementation 'com.google.android.material:material:1.3.0'
        implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
        implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
        // 腾讯地图导航 SDK (摩托车导航)
        implementation('com.tencent.map:tencent-map-nav-sdk-core:7.7.1') { changing = true }
        implementation('com.tencent.openmap:foundation:0.9.0.e5ea763-lite') { changing = true }
        implementation('com.tencent.map:tencent-map-nav-sdk-tts:7.7.0') { changing = true }

        testImplementation 'junit:junit:4.13.2'
        androidTestImplementation 'androidx.test.ext:junit:1.1.2'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    }

    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }